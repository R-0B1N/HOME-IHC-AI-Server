services:
  agent-sandbox:
    build: .
    volumes:
      # Mount the project directory so the agent can read/write files
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    command: /bin/bash -c "pip install -r requirements.txt && ./loop.sh"
