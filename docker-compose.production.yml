version: '3.8'

networks:
  crm_network:
    external: true
  prod_net:
    driver: bridge

services:
  frontend_production:
    build:
      context: ./property-dashboard
      dockerfile: Dockerfile
    container_name: whatsapp_ai_frontend_production
    restart: unless-stopped
    ports:
      - "3002:80"
    networks:
      - prod_net

  api_production:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsapp_ai_api_production
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      - REDIS_HOST=whatsapp_ai_redis_production
      - REDIS_PORT=6379
      - DB_HOST=whatsapp_ai_db_production
      - DB_USER=n8n
      - DB_PASSWORD=n8n
      - DB_NAME=whatsapp_ai
      - CHATWOOT_BASE_URL=http://crm-chatwoot-web:3000
      - CHATWOOT_API_TOKEN=E8wuqP3YDvyPXYwoQcTXLnTT
      - OLLAMA_BASE_URL=http://crm-ollama:11434
    depends_on:
      - redis_production
      - db_production
    networks:
      - prod_net
      - crm_network

  worker_production:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsapp_ai_worker_production
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      - REDIS_HOST=whatsapp_ai_redis_production
      - REDIS_PORT=6379
      - DB_HOST=whatsapp_ai_db_production
      - DB_USER=n8n
      - DB_PASSWORD=n8n
      - DB_NAME=whatsapp_ai
      - CHATWOOT_BASE_URL=http://crm-chatwoot-web:3000
      - CHATWOOT_API_TOKEN=E8wuqP3YDvyPXYwoQcTXLnTT
      - OLLAMA_BASE_URL=http://crm-ollama:11434
    depends_on:
      - redis_production
      - db_production
    networks:
      - prod_net
      - crm_network

  redis_production:
    image: redis:7-alpine
    container_name: whatsapp_ai_redis_production
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - prod_net

  db_production:
    image: pgvector/pgvector:pg16
    container_name: whatsapp_ai_db_production
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n
      - POSTGRES_DB=whatsapp_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - prod_net

volumes:
  postgres_data:
    name: crm_whatsapp_ai_postgres_data
    external: true
