version: '3.8'

networks:
  crm_network:
    external: true
  prod_net:
    driver: bridge

services:
  frontend_production:
    build:
      context: ./property-dashboard
      dockerfile: Dockerfile
    container_name: whatsapp_ai_frontend_production
    restart: unless-stopped
    ports:
      - "3002:80"
    networks:
      - prod_net
      - crm_network

  api_production:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsapp_ai_api_production
    restart: unless-stopped
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=whatsapp_ai_redis_production
      - REDIS_PORT=6379
      - DB_HOST=crm-postgres
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - CHATWOOT_BASE_URL=http://crm-chatwoot-web:3000
      - CHATWOOT_API_TOKEN=E8wuqP3YDvyPXYwoQcTXLnTT
      - OLLAMA_BASE_URL=http://crm-vllm:8000
    depends_on:
      - redis_production
    networks:
      - prod_net
      - crm_network

  worker_production:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsapp_ai_worker_production
    restart: unless-stopped
    profiles: ["disabled"]
    command: celery -A app.worker.celery_app worker --pool=gevent --concurrency=20 --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_HOST=whatsapp_ai_redis_production
      - REDIS_PORT=6379
      - DB_HOST=crm-postgres
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - CHATWOOT_BASE_URL=http://crm-chatwoot-web:3000
      - CHATWOOT_API_TOKEN=E8wuqP3YDvyPXYwoQcTXLnTT
      - OLLAMA_BASE_URL=http://crm-vllm:8000
    depends_on:
      - redis_production
    networks:
      - prod_net
      - crm_network

  redis_production:
    image: redis:7-alpine
    container_name: whatsapp_ai_redis_production
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - prod_net
