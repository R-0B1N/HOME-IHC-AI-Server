version: '3.8'

networks:
  crm_network:
    external: true
  staging_net:
    driver: bridge

services:
  frontend_staging:
    build:
      context: ./property-dashboard
      dockerfile: Dockerfile
    container_name: whatsapp_ai_frontend_staging
    restart: unless-stopped
    ports:
      - "3001:80"
    networks:
      - staging_net
      - crm_network

  api_staging:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsapp_ai_api_staging
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - REDIS_HOST=whatsapp_ai_redis_staging
      - REDIS_PORT=6379
      - DB_HOST=whatsapp_ai_db_staging
      - DB_USER=n8n
      - DB_PASSWORD=n8n
      - DB_NAME=whatsapp_ai
      - CHATWOOT_BASE_URL=http://crm-chatwoot-web:3000
      - CHATWOOT_API_TOKEN=E8wuqP3YDvyPXYwoQcTXLnTT
      - OLLAMA_BASE_URL=http://crm-vllm:8000
    depends_on:
      - redis_staging
      - db_staging
    networks:
      - staging_net
      - crm_network

  worker_staging:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsapp_ai_worker_staging
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --pool=gevent --concurrency=20 --loglevel=info
    environment:
      - REDIS_HOST=whatsapp_ai_redis_staging
      - REDIS_PORT=6379
      - DB_HOST=whatsapp_ai_db_staging
      - DB_USER=n8n
      - DB_PASSWORD=n8n
      - DB_NAME=whatsapp_ai
      - CHATWOOT_BASE_URL=http://crm-chatwoot-web:3000
      - CHATWOOT_API_TOKEN=E8wuqP3YDvyPXYwoQcTXLnTT
      - OLLAMA_BASE_URL=http://crm-vllm:8000
    depends_on:
      - redis_staging
      - db_staging
    networks:
      - staging_net
      - crm_network

  redis_staging:
    image: redis:7-alpine
    container_name: whatsapp_ai_redis_staging
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - staging_net

  db_staging:
    image: pgvector/pgvector:pg16
    container_name: whatsapp_ai_db_staging
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n
      - POSTGRES_DB=whatsapp_ai
    volumes:
      - staging_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - staging_net

volumes:
  staging_db_data:
