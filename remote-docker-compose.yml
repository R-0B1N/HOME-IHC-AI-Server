version: '3.8'

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/crm/postgres_data
  n8n_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/crm/n8n_data
  ollama_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/crm/ollama_data
  whisper_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/crm/whisper_data

networks:
  crm_network:
    external: true

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: crm-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crm_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  vllm:
    image: vllm/vllm-openai:latest
    container_name: crm-vllm
    restart: unless-stopped
    ports:
      - "11434:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
    command: --model google/gemma-4-12B-it-qat-w4a16-ct --served-model-name "google/gemma-4-12B-it" --trust-remote-code --max-model-len 2048 --gpu-memory-utilization 0.8
    volumes:
      - ollama_data:/models_root
    networks:
      - crm_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  whisper:
    image: fedirz/faster-whisper-server:latest-cuda
    container_name: crm-whisper
    restart: unless-stopped
    environment:
      - WHISPER_MODEL=base
    volumes:
      - whisper_data:/root/.cache/huggingface
    networks:
      - crm_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: crm-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - WEBHOOK_URL=https://n8n.bentongland.com.my/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - crm_network
    depends_on:
      postgres:
        condition: service_healthy
