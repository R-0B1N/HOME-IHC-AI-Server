name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "."
          target: "~/whatsapp-ai-prod"

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ~/whatsapp-ai-prod
            echo "Extracting DB credentials from crm-postgres..."
            DB_USER=$(docker exec crm-postgres env | grep POSTGRES_USER= | cut -d= -f2-)
            DB_PASS=$(docker exec crm-postgres env | grep POSTGRES_PASSWORD= | cut -d= -f2-)
            DB_NAME=$(docker exec crm-postgres env | grep POSTGRES_DB= | cut -d= -f2-)
            echo "POSTGRES_USER=$DB_USER" > .env
            echo "POSTGRES_PASSWORD=$DB_PASS" >> .env
            echo "POSTGRES_DB=$DB_NAME" >> .env
            docker compose -f docker-compose.production.yml up -d --build --remove-orphans
