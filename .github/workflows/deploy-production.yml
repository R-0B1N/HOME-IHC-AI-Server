name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Test Suite Gate
        working-directory: ./backend
        run: |
          python -m unittest tests/test_*.py

      - name: Run Conversational Backtest Gate
        working-directory: ./backend
        run: |
          python scripts/run_backtest.py

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "."
          target: "~/whatsapp-ai-prod"

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 30m
          timeout: 30m
          script: |
            cd ~/whatsapp-ai-prod
            docker compose -f docker-compose.production.yml up -d --build --remove-orphans
            
            echo "=== PRODUCTION CONTAINERS STATUS ==="
            docker ps -a
            
            echo "=== SLEEPING 5s TO CAPTURE WORKER STARTUP LOGS ==="
            sleep 5
            
            echo "=== PRODUCTION WORKER LOGS (LAST 100 LINES) ==="
            docker logs --tail=100 whatsapp_ai_worker_production || echo "No worker logs"
            
            echo "=== PRODUCTION API LOGS (LAST 100 LINES) ==="
            docker logs --tail=100 whatsapp_ai_api_production || echo "No api logs"
            
            echo "=== PRODUCTION DEPLOYMENT COMPLETE ==="
