name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "."
          target: "~/whatsapp-ai-prod"

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ~/whatsapp-ai-prod
            echo "Setting up database credentials..."
            # 1. Get the superuser name from crm-postgres
            SUPER_USER=$(docker exec crm-postgres env | grep POSTGRES_USER= | cut -d= -f2- | tr -d '\r')
            
            # 2. Provision admin user and whatsapp_ai database
            docker exec crm-postgres psql -U $SUPER_USER -c "CREATE USER admin WITH PASSWORD 'P@ssw0rd';" || docker exec crm-postgres psql -U $SUPER_USER -c "ALTER USER admin WITH PASSWORD 'P@ssw0rd';"
            docker exec crm-postgres psql -U $SUPER_USER -c "CREATE DATABASE whatsapp_ai OWNER admin;" || true
            docker exec crm-postgres psql -U $SUPER_USER -d whatsapp_ai -c "GRANT ALL PRIVILEGES ON DATABASE whatsapp_ai TO admin;" || true
            docker exec crm-postgres psql -U $SUPER_USER -d whatsapp_ai -c "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO admin;" || true
            docker exec crm-postgres psql -U $SUPER_USER -d whatsapp_ai -c "GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO admin;" || true
            
            # 3. Write .env for the app
            echo "POSTGRES_USER=admin" > .env
            echo "POSTGRES_PASSWORD=P@ssw0rd" >> .env
            echo "POSTGRES_DB=whatsapp_ai" >> .env
            docker compose -f docker-compose.production.yml up -d --build --remove-orphans
