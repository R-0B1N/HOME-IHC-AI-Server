name: Server Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Run Diagnostics via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "=== CONTAINER STATUS ==="
            docker ps -a --format '{{.Names}} | {{.Status}} | {{.Ports}}' | grep -iE 'whatsapp|staging|production' || true
            
            echo "=== PRODUCTION API LOGS ==="
            docker logs whatsapp_ai_api_production --tail 100 2>&1 || true
            
            echo "=== PRODUCTION WORKER LOGS ==="
            docker logs whatsapp_ai_worker_production --tail 100 2>&1 || true
            
            echo "=== PRODUCTION DB LOGS ==="
            docker logs whatsapp_ai_db_production --tail 20 2>&1 || true

            echo "=== STAGING API LOGS ==="
            docker logs whatsapp_ai_api_staging --tail 100 2>&1 || true
            
            echo "=== STAGING WORKER LOGS ==="
            docker logs whatsapp_ai_worker_staging --tail 100 2>&1 || true

