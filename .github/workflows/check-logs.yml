name: Check Logs
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Get Logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "=== CRM POSTGRES: whatsapp_ai DB TABLES ==="
            docker exec crm-postgres psql -U crm_admin -d whatsapp_ai -c "\dt" || true
            docker exec crm-postgres psql -U crm_admin -d whatsapp_ai -c "SELECT count(*) AS properties_count FROM properties;" || true
            docker exec crm-postgres psql -U crm_admin -d whatsapp_ai -c "SELECT count(*) AS customers_count FROM customers;" || true
            docker exec crm-postgres psql -U crm_admin -d whatsapp_ai -c "SELECT count(*) AS transactions_count FROM transactions;" || true
            docker exec crm-postgres psql -U crm_admin -d whatsapp_ai -c "SELECT id, title, asking_price_myr, listing_status FROM properties LIMIT 5;" || true
            docker exec crm-postgres psql -U crm_admin -d whatsapp_ai -c "SELECT id, name, phone_number, created_at FROM customers LIMIT 5;" || true
            echo "=== CRM POSTGRES: n8n_crm DB TABLES ==="
            docker exec crm-postgres psql -U crm_admin -d n8n_crm -c "SELECT count(*) FROM properties;" || true
            docker exec crm-postgres psql -U crm_admin -d n8n_crm -c "SELECT count(*) FROM customers;" || true



