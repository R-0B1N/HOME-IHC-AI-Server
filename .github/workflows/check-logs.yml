name: Check Logs
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Get Logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "=== PRE-MIGRATION BACKUP INSPECTION ==="
            head -n 50 /home/*/opt/Whatsapp_AI/backend/scripts/db_backup_pre_migration.sql 2>/dev/null || true
            grep -E "INSERT INTO public.properties|INSERT INTO properties|INSERT INTO public.customers|INSERT INTO customers" /home/*/opt/Whatsapp_AI/backend/scripts/db_backup_pre_migration.sql 2>/dev/null | head -n 10 || true
            grep -c "INSERT INTO" /home/*/opt/Whatsapp_AI/backend/scripts/db_backup_pre_migration.sql 2>/dev/null || true
            echo "=== CHECKING FOR ANY OTHER SQL FILES ON SERVER ==="
            find / -name "*property*.sql" -o -name "*backup*.sql" -o -name "*n8n*.sql" 2>/dev/null | grep -v "/proc" | head -n 20 || true





