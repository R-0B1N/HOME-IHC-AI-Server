name: Check Logs
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Get Logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "======================================================="
            echo "1. DOCKER CONTAINERS STATUS"
            echo "======================================================="
            docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "======================================================="
            echo "2. CHATWOOT LOGS FOR 18:07:18 & MSG 1240"
            echo "======================================================="
            docker exec crm-chatwoot-web grep -n "1240" /app/log/production.log 2>/dev/null | tail -n 20 || echo "No 1240 in web log"
            docker exec crm-chatwoot-worker grep -n "1240" /app/log/production.log 2>/dev/null | tail -n 20 || echo "No 1240 in worker log"
            docker exec crm-chatwoot-worker grep -n "staging-ai" /app/log/production.log 2>/dev/null | tail -n 20 || echo "No staging-ai in worker log"

            echo "======================================================="
            echo "3. TEST WEBHOOK CONNECTIVITY FROM CHATWOOT TO STAGING AI"
            echo "======================================================="
            docker exec crm-chatwoot-web bundle exec rails runner "
              w = Webhook.find_by(id: 5)
              puts \"Webhook 5: #{w&.url} (Account #{w&.account_id}, Inbox #{w&.inbox_id})\"
              
              # Test connectivity to staging AI URL
              require 'net/http'
              require 'uri'
              uri = URI(w.url)
              puts \"Testing connection to #{uri}...\"
              res = Net::HTTP.get_response(URI('http://whatsapp_ai_api_staging:8000/docs')) rescue \$!
              puts \"Direct container connection to whatsapp_ai_api_staging:8000: #{res.is_a?(Net::HTTPResponse) ? res.code : res}\"
              
              # Re-trigger webhook for Msg 1240 to see what happens
              m = Message.find_by(id: 1240)
              if m && w
                puts \"Simulating webhook execution for Message 1240...\"
                payload = m.webhook_data.merge(event: 'message_created')
                begin
                  Webhooks::Trigger.execute(w.url, payload, :account_hook, secret: w.secret)
                  puts 'Webhooks::Trigger.execute SUCCEEDED!'
                rescue => e
                  puts \"Webhooks::Trigger.execute FAILED: #{e.class}: #{e.message}\"
                end
              end
            " || echo "Webhook test failed"

            echo "======================================================="
            echo "3. STAGING REDIS INSPECTION"
            echo "======================================================="
            docker exec whatsapp_ai_redis_staging redis-cli keys "*" || echo "Redis keys check failed"
            docker exec whatsapp_ai_redis_staging redis-cli get master_ai_enabled || echo "No master_ai_enabled key"
            docker exec whatsapp_ai_redis_staging redis-cli lrange convo_queue_69 0 -1 2>/dev/null || echo "No convo_queue_69"
            docker exec whatsapp_ai_redis_staging redis-cli get convo_active_69 2>/dev/null || echo "No convo_active_69"

            echo "======================================================="
            echo "4. STAGING API LOGS (LAST 500 LINES)"
            echo "======================================================="
            docker logs --tail 500 whatsapp_ai_api_staging || echo "No staging api logs"

            echo "======================================================="
            echo "5. STAGING WORKER LOGS (LAST 500 LINES)"
            echo "======================================================="
            docker logs --tail 500 whatsapp_ai_worker_staging || echo "No staging worker logs"

            echo "======================================================="
            echo "6. CHATWOOT WEB SERVER LOGS (FILTERED OR LAST 200 LINES)"
            echo "======================================================="
            docker logs --tail 300 crm-chatwoot-web || echo "No chatwoot web logs"

            echo "======================================================="
            echo "7. CHATWOOT WORKER (SIDEKIQ) LOGS (LAST 200 LINES)"
            echo "======================================================="
            docker logs --tail 300 crm-chatwoot-worker || echo "No chatwoot worker logs"

            echo "======================================================="
            echo "8. VLLM SERVER LOGS (LAST 100 LINES)"
            echo "======================================================="
            docker logs --tail 100 crm-vllm 2>/dev/null || echo "No vllm logs"








