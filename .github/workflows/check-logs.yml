name: Check Logs
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Get Logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "=== 1. RUNNING WORKFLOW SEEDING (ERA REALTOR) ==="
            cd ~/whatsapp-ai-staging
            docker compose -f docker-compose.staging.yml exec -T api_staging python scripts/seed_workflows.py
            
            echo "=== 2. RUNNING PROPERTY SCRAPING (TAMAN AZALEA & ALL LISTINGS) ==="
            docker compose -f docker-compose.staging.yml exec -T api_staging python scripts/scrape_and_ingest_all_properties.py
            
            echo "=== 3. CHECKING TAMAN AZALEA IN STAGING DATABASE ==="
            docker compose -f docker-compose.staging.yml exec -T api_staging python -c "
from app.db.models import SessionLocal, Property
db = SessionLocal()
p = db.query(Property).filter(Property.title.ilike('%Taman Azalea%')).first()
if p:
    print(f'FOUND: {p.title}')
    print(f'  Asking Price MYR: {p.asking_price_myr}')
    print(f'  Price Per Sqft: {p.price_per_sqft_myr}')
    print(f'  Category: {p.property_category}')
else:
    print('Taman Azalea not found in DB')
db.close()
"








