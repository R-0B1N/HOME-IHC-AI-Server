name: Check Logs
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Get Logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "=== STAGING DB: CUSTOMERS & LEADS ==="
            docker exec whatsapp_ai_db_staging psql -U n8n -d whatsapp_ai -c "\d customers" || true
            docker exec whatsapp_ai_db_staging psql -U n8n -d whatsapp_ai -c "SELECT * FROM customers LIMIT 10;" || true
            docker exec whatsapp_ai_db_staging psql -U n8n -d whatsapp_ai -c "SELECT * FROM properties LIMIT 10;" || true
            docker exec whatsapp_ai_db_staging psql -U n8n -d whatsapp_ai -c "SELECT * FROM interaction_logs LIMIT 5;" || true
            echo "=== CHATWOOT DB CONTACTS & CONVERSATIONS ==="
            docker exec crm-postgres psql -U crm_admin -d chatwoot -c "SELECT count(*) AS contacts_count FROM contacts;" || true
            docker exec crm-postgres psql -U crm_admin -d chatwoot -c "SELECT count(*) AS conversations_count FROM conversations;" || true
            docker exec crm-postgres psql -U crm_admin -d chatwoot -c "SELECT id, name, phone_number, email FROM contacts LIMIT 10;" || true
            echo "=== SEARCH FOR SQL DUMPS OR BACKUPS ON HOST ==="
            find /home -name "*.sql" -o -name "*.dump" 2>/dev/null || true




