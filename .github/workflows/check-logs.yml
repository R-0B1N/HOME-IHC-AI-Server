name: Check Logs
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Get Logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "=== TRIGGERING TEST WEBHOOK TO STAGING API ==="
            curl -s -X POST http://localhost:8001/api/v1/webhooks/chatwoot \
              -H "Content-Type: application/json" \
              -d '{"event":"message_created","message_type":"incoming","id":99999999,"content":"Hello, looking for durian land in Bentong","account":{"id":1},"inbox":{"id":1},"conversation":{"id":69,"inbox_id":1,"status":"open"},"sender":{"id":999,"name":"Diagnostics Test User","phone_number":"+60126761818"}}'
            
            echo ""
            echo "=== WAITING 15s FOR DEBOUNCER & CELERY WORKER ==="
            sleep 15
            
            echo "=== STAGING COMPOSE LOGS ==="
            cd ~/whatsapp-ai-staging
            docker compose -f docker-compose.staging.yml logs --tail 60 worker_staging api_staging








