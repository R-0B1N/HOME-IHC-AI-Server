name: Check Logs
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Get Logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "=== DATABASES ON CRM POSTGRES ==="
            docker exec crm-postgres psql -U crm_admin -d n8n_crm -c "\l"
            echo "=== DATABASES ON STAGING POSTGRES ==="
            docker exec whatsapp_ai_db_staging psql -U n8n -d whatsapp_ai -c "\l" || true
            echo "=== STAGING CUSTOMERS SAMPLE ==="
            docker exec whatsapp_ai_db_staging psql -U n8n -d whatsapp_ai -c "SELECT id, name, phone_number, created_at FROM customers LIMIT 10;" || true
            echo "=== CHECKING FOR ANY PROPERTIES IN OTHER STAGING TABLES ==="
            docker exec whatsapp_ai_db_staging psql -U n8n -d whatsapp_ai -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public';" || true
            echo "=== DOCKER CONTAINERS LIST ==="
            docker ps -a


