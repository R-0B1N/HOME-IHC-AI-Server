name: Check Logs
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Get Logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "=== CRM POSTGRES TABLES & COUNTS ==="
            docker exec crm-postgres psql -U crm_admin -d n8n_crm -c "\dt"
            docker exec crm-postgres psql -U crm_admin -d n8n_crm -c "SELECT count(*) AS properties_count FROM properties;" || true
            docker exec crm-postgres psql -U crm_admin -d n8n_crm -c "SELECT count(*) AS customers_count FROM customers;" || true
            docker exec crm-postgres psql -U crm_admin -d n8n_crm -c "SELECT count(*) AS crm_users_count FROM crm_users;" || true
            echo "=== STAGING DB TABLES & COUNTS ==="
            docker exec whatsapp_ai_db_staging psql -U n8n -d whatsapp_ai -c "\dt" || true
            docker exec whatsapp_ai_db_staging psql -U n8n -d whatsapp_ai -c "SELECT count(*) AS properties_count FROM properties;" || true
            docker exec whatsapp_ai_db_staging psql -U n8n -d whatsapp_ai -c "SELECT count(*) AS customers_count FROM customers;" || true
            echo "=== API PRODUCTION LOGS ==="
            docker logs whatsapp_ai_api_production --tail 40

