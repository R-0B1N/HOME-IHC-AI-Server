name: Check Logs
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Get Logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "=== STAGING WORKER RECENT LOGS ==="
            docker logs whatsapp_ai_worker_staging --tail 60 2>&1 || true
            
            echo "=== STAGING API RECENT LOGS ==="
            docker logs whatsapp_ai_api_staging --tail 60 2>&1 || true
            
            echo "=== CHATWOOT WEBHOOK DISPATCH STATUS ==="
            docker logs crm-chatwoot-web --tail 40 2>&1 || true






