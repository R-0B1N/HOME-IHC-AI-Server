name: Update Config (Production)

on:
  workflow_dispatch:

jobs:
  update-config:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Update .env on Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            mkdir -p ~/whatsapp-ai-prod
            cd ~/whatsapp-ai-prod
            
            cat << 'EOF' > .env
            # Database Configuration
            POSTGRES_USER=${{ secrets.POSTGRES_USER_PROD }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_PROD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB_PROD }}
            
            # Application Configuration
            CHATWOOT_BASE_URL=${{ secrets.CHATWOOT_BASE_URL_PROD }}
            CHATWOOT_API_TOKEN=${{ secrets.CHATWOOT_API_TOKEN_PROD }}
            CHATWOOT_ACCOUNT_ID=${{ secrets.CHATWOOT_ACCOUNT_ID_PROD }}
            CHATWOOT_WEBHOOK_SECRET=${{ secrets.CHATWOOT_WEBHOOK_SECRET_PROD }}
            
            WHATSAPP_APP_SECRET=${{ secrets.WHATSAPP_APP_SECRET_PROD }}
            WHATSAPP_VERIFY_TOKEN=${{ secrets.WHATSAPP_VERIFY_TOKEN_PROD }}
            
            # Optional Hugging Face Token (if using gated models)
            HF_TOKEN=${{ secrets.HF_TOKEN_PROD }}
            EOF
            
            echo "Environment variables updated successfully in production."
