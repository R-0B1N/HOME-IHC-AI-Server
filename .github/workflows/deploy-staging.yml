name: Deploy to Staging

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "."
          target: "~/whatsapp-ai-staging"

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 30m
          timeout: 30m
          script: |
            cd ~/whatsapp-ai-staging
            docker compose -f docker-compose.staging.yml up -d --build --remove-orphans
            
            echo "=== SERVER CONTAINERS STATUS ==="
            docker ps -a

            
            echo "=== SLEEPING 5s TO CAPTURE WORKER STARTUP LOGS ==="
            sleep 5
            
            echo "=== STAGING WORKER LOGS (LAST 100 LINES) ==="
            docker logs --tail=100 whatsapp_ai_worker_staging || echo "No worker logs"
            
            echo "=== STAGING API LOGS (LAST 100 LINES) ==="
            docker logs --tail=100 whatsapp_ai_api_staging || echo "No api logs"
            
            echo "=== STAGING DEPLOYMENT & VECTORIZATION COMPLETE ==="



