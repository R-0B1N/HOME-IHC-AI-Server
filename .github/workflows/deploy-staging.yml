name: Deploy to Staging

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "."
          target: "~/whatsapp-ai-staging"

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ~/whatsapp-ai-staging
            docker compose -f docker-compose.staging.yml up -d --build --remove-orphans
            
            # Wait a few seconds for DB to be ready if needed, then run scripts
            sleep 5
            
            # Seed the workflow templates
            docker compose -f docker-compose.staging.yml exec -T backend python -m scripts.seed_workflows
            
            # Reset ignore_ai flags for testing purposes
            docker compose -f docker-compose.staging.yml exec -T backend python -m scripts.reset_ai_flags
