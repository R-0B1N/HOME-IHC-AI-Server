name: Deploy to Staging

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "."
          target: "~/whatsapp-ai-staging"

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ~/whatsapp-ai-staging
            docker compose -f docker-compose.staging.yml up -d --build --remove-orphans
            
            echo "=== STAGING SERVER NETWORK & ACCESS INFO ==="
            echo "Server Public IP: $(curl -s https://ifconfig.me || curl -s https://api.ipify.org || echo 'N/A')"
            echo "Tailscale IP: $(tailscale ip -4 2>/dev/null || echo 'N/A')"
            echo "Staging Frontend Local Port: http://localhost:3001"
            echo "Staging API Webhook Port:    http://localhost:8001"
            
            echo "=== EXECUTING 12-CATEGORY SCHEMA & 5-ASPECT VECTOR REPROCESSING ==="
            docker compose -f docker-compose.staging.yml exec -T api_staging python scripts/reprocess_and_enrich_all_properties.py
            
            echo "=== STAGING DEPLOYMENT & VECTORIZATION COMPLETE ==="

