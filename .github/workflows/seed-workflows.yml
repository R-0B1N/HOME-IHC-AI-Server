name: Seed Workflows

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Execute Workflow Seeding via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "=== SEEDING WORKFLOWS ON ${{ github.event.inputs.environment }} ==="
            if [ "${{ github.event.inputs.environment }}" = "production" ]; then
              cd ~/whatsapp-ai-prod
              docker compose -f docker-compose.production.yml exec -T api_production python scripts/seed_workflows.py
            else
              cd ~/whatsapp-ai-staging
              docker compose -f docker-compose.staging.yml exec -T api_staging python scripts/seed_workflows.py
            fi
            echo "=== WORKFLOW SEEDING COMPLETED ==="
