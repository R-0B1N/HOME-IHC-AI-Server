name: Reprocess Properties (Staging)

on:
  workflow_dispatch:

jobs:
  reprocess:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Run Reprocess and Embedding Script on Staging
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "=== SERVER NETWORK & IP INFO ==="
            echo "Public IP: $(curl -s https://ifconfig.me || curl -s https://api.ipify.org || echo 'N/A')"
            echo "Internal IP: $(hostname -I | awk '{print $1}')"
            echo "Tailscale Status:"
            tailscale ip -4 || true
            
            echo "=== STAGING CONTAINERS ==="
            docker ps --filter "name=staging" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            
            echo "=== RUNNING WORKFLOW SEEDING ==="
            cd ~/whatsapp-ai-staging
            docker compose -f docker-compose.staging.yml exec -T api_staging python scripts/seed_workflows.py
            
            echo "=== RUNNING WORDPRESS DATA INGESTION & SCRAPING ==="
            docker compose -f docker-compose.staging.yml exec -T api_staging python scripts/scrape_and_ingest_all_properties.py
            
            echo "=== RUNNING 12-CATEGORY SCHEMA & 5-ASPECT VECTOR REPROCESSING ==="
            docker compose -f docker-compose.staging.yml exec -T api_staging python scripts/reprocess_and_enrich_all_properties.py
            
            echo "=== STAGING INGESTION, SEEDING & VECTORIZATION COMPLETED ==="
