version: '3.8'

networks:
  crm_network:
    external: true

volumes:
  postgres_data:
    name: crm_whatsapp_ai_postgres_data
    external: true

services:
  dashboard:
    build: ./dashboard
    container_name: crm-dashboard
    restart: unless-stopped
    pid: host
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/crm/dashboard:/app
    networks:
      - crm_network

  netdata:
    image: netdata/netdata:latest
    container_name: crm-netdata
    restart: unless-stopped
    pid: host
    cap_add:
      - SYS_PTRACE
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    networks:
      - crm_network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: crm-tunnel
    restart: unless-stopped
    command: tunnel --config /home/nonroot/.cloudflared/config.yml run 3a53ce15-66be-4871-9b88-ec881726721d
    environment:
      - TUNNEL_TRANSPORT_PROTOCOL=http2
      - TUNNEL_NO_TLS_VERIFY=true
    volumes:
      - /opt/crm/tunnel:/home/nonroot/.cloudflared
    networks:
      - crm_network

  tailscale:
    image: tailscale/tailscale:latest
    container_name: crm-tailscale
    restart: unless-stopped
    hostname: homeihc-ai-server
    network_mode: host
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--accept-dns=false
    volumes:
      - /opt/crm/tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW

