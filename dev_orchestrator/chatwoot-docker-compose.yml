version: '3.8'

networks:
  crm_network:
    external: true

services:
  chatwoot-redis:
    image: redis:7-alpine
    container_name: crm-chatwoot-redis
    restart: unless-stopped
    volumes:
      - /opt/crm/chatwoot_redis_data:/data
    networks:
      - crm_network

  chatwoot-web:
    image: chatwoot/chatwoot:v4.15.1
    container_name: crm-chatwoot-web
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    volumes:
      - /opt/crm/chatwoot_data:/app/storage
      - /opt/crm/chatwoot/disable_24_hour_window.rb:/app/config/initializers/disable_24_hour_window.rb
    networks:
      - crm_network
    depends_on:
      - chatwoot-redis

  chatwoot-worker:
    image: chatwoot/chatwoot:v4.15.1
    container_name: crm-chatwoot-worker
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    volumes:
      - /opt/crm/chatwoot_data:/app/storage
      - /opt/crm/chatwoot/disable_24_hour_window.rb:/app/config/initializers/disable_24_hour_window.rb
    networks:
      - crm_network
    depends_on:
      - chatwoot-redis
